<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    // Load order matters: esm.sh's "?bundle" build of @excalidraw/excalidraw has a
    // broken transitive import (@braintree/sanitize-url .mjs 404s), so jsDelivr's
    // pre-bundled +esm build is the primary source and esm.sh is the fallback.
    const SOURCES = [
      "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/+esm",
      "https://esm.sh/@excalidraw/excalidraw@0.18.1",
    ];

    let exportToSvg = null;
    const loadErrors = [];
    for (const src of SOURCES) {
      try {
        const mod = await import(src);
        if (typeof mod.exportToSvg === "function") {
          exportToSvg = mod.exportToSvg;
          break;
        }
        loadErrors.push(`${src}: no exportToSvg export`);
      } catch (err) {
        loadErrors.push(`${src}: ${err.message}`);
      }
    }

    if (!exportToSvg) {
      // Surface the failure instead of hanging until the wait_for_function timeout.
      window.__moduleError = loadErrors.join(" | ");
      window.__moduleReady = true;
      throw new Error(window.__moduleError);
    }

    window.renderDiagram = async function(jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const elements = data.elements || [];
        const appState = data.appState || {};
        const files = data.files || {};

        // Force white background in appState
        appState.viewBackgroundColor = appState.viewBackgroundColor || "#ffffff";
        appState.exportWithDarkMode = false;

        const svg = await exportToSvg({
          elements: elements,
          appState: {
            ...appState,
            exportBackground: true,
          },
          files: files,
        });

        // Clear any previous render
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);

        window.__renderComplete = true;
        window.__renderError = null;
        return { success: true, width: svg.getAttribute("width"), height: svg.getAttribute("height") };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err.message;
        return { success: false, error: err.message };
      }
    };

    // Signal that the module is loaded and ready
    window.__moduleReady = true;
  </script>
</body>
</html>
